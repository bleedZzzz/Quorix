[project]
name = "quorix-api"
version = "0.1.0"
description = "Quorix — Evidence-First Agentic Research AI (Backend API)"

license = "Apache-2.0"
requires-python = ">=3.12"

dependencies = [
    # API Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Validation
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.0",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Redis
    "redis>=5.2",

    # Object Storage
    "boto3>=1.35",

    # PDF Processing
    "pymupdf>=1.24",

    # AI / Agent Orchestration
    "langchain-core>=0.3",
    "langgraph>=0.2",

    # Vector Database
    "qdrant-client>=1.12",

    # Security
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",

    # HTTP Client
    "httpx>=0.27",

    # Logging
    "structlog>=24.4",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.37"]
google = ["google-generativeai>=0.8"]
groq = ["groq>=0.11"]
tavily = ["tavily-python>=0.4"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "E501", "B904", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
